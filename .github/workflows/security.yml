name: "Security"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '44 19 * * 2'
  workflow_dispatch: 

jobs:
  changes:
    name: Detect security-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
      codeql-matrix: ${{ steps.codeql.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect security-relevant changes
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            source:
              - '.github/**'
              - 'app/**'
              - 'core/**'
              - 'config/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
            swift:
              - 'app/iosApp/**'
              - '.github/workflows/security.yml'

      # Swift analysis needs a macOS runner, which is slow to schedule. Scan Swift
      # only when Swift sources change, plus the weekly and manual full scans.
      - name: Select CodeQL languages
        id: codeql
        env:
          EVENT_NAME: ${{ github.event_name }}
          SWIFT_CHANGED: ${{ steps.filter.outputs.swift }}
        run: |
          languages='{"language":"actions","build-mode":"none"},{"language":"java-kotlin","build-mode":"manual"}'
          if [ "$EVENT_NAME" = 'schedule' ] || [ "$EVENT_NAME" = 'workflow_dispatch' ] || [ "$SWIFT_CHANGED" = 'true' ]; then
            languages="$languages"',{"language":"swift","build-mode":"manual"}'
          fi
          echo "matrix={\"include\":[$languages]}" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.source == 'true')
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.codeql-matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. Prepare environment ONLY for Kotlin/Java compilation
      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle Cache
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      # 2. Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          tools: linked

      # 3. Compile Step
      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.language }}" = "java-kotlin" ]; then
            chmod +x gradlew
            ./gradlew clean \
              :core:compileKotlinJvm \
              :core:compileAndroidMain \
              :app:sharedLogic:compileAndroidMain \
              :app:sharedUI:compileAndroidMain \
              :app:androidApp:compileDebugKotlin \
              --stacktrace --no-daemon --no-build-cache --rerun-tasks
          elif [ "${{ matrix.language }}" = "swift" ]; then
            xcodebuild \
              -project app/iosApp/iosApp.xcodeproj \
              -scheme iosApp \
              -sdk iphonesimulator \
              -configuration Debug \
              -derivedDataPath build/codeql-ios-derived-data \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            echo "No manual build needed for ${{ matrix.language }}"
          fi

      # 4. Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

  trivy-sca:
    name: Dependency Scan (Trivy)
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.source == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Generate Android release SBOM
        run: >-
          ./gradlew :app:androidApp:cyclonedxDirectBom
          --stacktrace --no-daemon --no-configuration-cache

      - name: Validate Android release SBOM
        shell: bash
        run: |
          sbom_path='build/reports/sbom/android-release.cdx.json'
          if [[ ! -s "$sbom_path" ]]; then
            echo "::error file=$sbom_path::CycloneDX SBOM is missing or empty"
            exit 1
          fi
          if ! component_count="$(jq -er '
            select(.bomFormat == "CycloneDX")
            | (.components // [])
            | select(length > 0)
            | length
          ' "$sbom_path")"; then
            echo "::error file=$sbom_path::CycloneDX SBOM is invalid or has no components"
            exit 1
          fi
          echo "CycloneDX SBOM components: $component_count"

      - name: Preserve Android release SBOM
        uses: actions/upload-artifact@v7
        with:
          name: android-release-cyclonedx-sbom
          path: build/reports/sbom/android-release.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Run Trivy vulnerability scanner
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.70.0'
          scan-type: 'sbom'
          scan-ref: 'build/reports/sbom/android-release.cdx.json'
          scanners: 'vuln'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-sca'

      - name: Preserve Trivy SARIF report
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          name: trivy-results-sarif
          path: trivy-results.sarif
          retention-days: 14

      - name: Enforce Trivy result
        if: always() && steps.trivy.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Trivy found a HIGH or CRITICAL vulnerability, or the SBOM scan failed"
          exit 1
