name: Calculate DevOps Metrics

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      deployments: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: DevOps Metrics from GitHub
        id: dora
        uses: stenjo/devops-metrics-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Displays a visual table on the GitHub Actions Run summary page
      - name: Add Metrics to Summary
        run: |
          echo "### 📊 DevOps DORA Metrics" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Frequency | ${{ steps.dora.outputs.deploy-frequency }} / week |" >> $GITHUB_STEP_SUMMARY
          echo "| Lead Time | ${{ steps.dora.outputs.lead-time }} days |" >> $GITHUB_STEP_SUMMARY
          echo "| Change Failure Rate | ${{ steps.dora.outputs.change-failure-rate }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| MTTR | ${{ steps.dora.outputs.mttr }} hours |" >> $GITHUB_STEP_SUMMARY

      # Prints directly into the step's console logs
      - name: Print to Logs
        run: |
          echo "Deployment Frequency: ${{ steps.dora.outputs.deploy-frequency }}"
          echo "Lead Time: ${{ steps.dora.outputs.lead-time }}"
          echo "Change Failure Rate: ${{ steps.dora.outputs.change-failure-rate }}"
          echo "MTTR: ${{ steps.dora.outputs.mttr }}"