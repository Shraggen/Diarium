name: GitHub Release

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare or create release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Validate Release Please token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "Missing RELEASE_PLEASE_TOKEN repository secret."
            echo "See docs/releasing.md for the required fine-grained token permissions."
            exit 1
          fi

      - name: Update release pull request or create draft release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-publish:
    name: Build, sign, and publish Android release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      actions: read
      contents: write
      id-token: write
      pull-requests: read
      attestations: write
      artifact-metadata: write

    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
      ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
      ORG_GRADLE_PROJECT_DIARIUM_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_DIARIUM_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_DIARIUM_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release metadata
        shell: bash
        run: |
          repository_version="$(tr -d '\r\n' < version.txt)"
          if [ "$repository_version" != "$RELEASE_VERSION" ]; then
            echo "Release version $RELEASE_VERSION does not match version.txt ($repository_version)."
            exit 1
          fi

      # Build once, promote: reuse the signed APKs that CI built and verified on
      # the release PR when they were built from exactly the tagged source tree.
      - name: Promote release candidate from the release PR
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          rebuild() {
            echo "$1 Rebuilding from the tagged commit."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          pr_head_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls" \
              --jq '[.[] | select(.head.ref | startswith("release-please--"))][0].head.sha // empty' \
              || true
          )"
          [ -n "$pr_head_sha" ] || rebuild "No release PR is associated with $RELEASE_SHA."

          run_id="$(
            gh run list \
              --workflow ci.yml \
              --event pull_request \
              --commit "$pr_head_sha" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty' \
              || true
          )"
          [ -n "$run_id" ] || rebuild "No successful CI run exists for release PR head $pr_head_sha."

          candidate_dir="$RUNNER_TEMP/release-candidate"
          gh run download "$run_id" --name release-candidate-apks --dir "$candidate_dir" \
            || rebuild "CI run $run_id has no release candidate artifact."

          candidate_tree="$(tr -d '\r\n' < "$candidate_dir/candidate-tree.txt")"
          release_tree="$(git rev-parse "$RELEASE_SHA^{tree}")"
          [ "$candidate_tree" = "$release_tree" ] \
            || rebuild "Candidate tree $candidate_tree differs from tagged tree $release_tree."

          mkdir -p app/androidApp/build/outputs/apk/release
          mv "$candidate_dir"/*.apk app/androidApp/build/outputs/apk/release/
          echo "Promoting APKs from CI run $run_id (tree $release_tree)."
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      - name: Restore and verify signing key
        if: steps.candidate.outputs.promoted != 'true'
        uses: ./.github/actions/restore-android-signing-key

      - name: Verify and build released commit
        if: steps.candidate.outputs.promoted != 'true'
        run: >-
          ./gradlew
          detekt
          :core:jvmTest
          :app:sharedLogic:allTests
          :app:sharedUI:allTests
          :app:androidApp:lintRelease
          :app:androidApp:assembleRelease
          --stacktrace
          --no-daemon

      - name: Verify APK signatures
        uses: ./.github/actions/verify-apk-signatures
        with:
          apk-dir: app/androidApp/build/outputs/apk/release

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets

          for apk in app/androidApp/build/outputs/apk/release/*.apk; do
            filename=$(basename "$apk")
            abi=$(echo "$filename" | sed -E 's/androidApp-(.*)-release\.apk/\1/')
            
            target_name="Diarium-${RELEASE_TAG}-${abi}.apk"
            cp "$apk" "release-assets/$target_name"
          done

          pushd release-assets
          for asset in *.apk; do
            sha256sum "$asset" > "$asset.sha256"
          done
          popd

      - name: Attest public release artifact
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*.apk

      - name: Attach assets to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Remove restored keystore
        if: always()
        shell: bash
        run: |
          if [ -n "${ORG_GRADLE_PROJECT_DIARIUM_RELEASE_STORE_FILE:-}" ]; then
            rm -f "$ORG_GRADLE_PROJECT_DIARIUM_RELEASE_STORE_FILE"
          fi
