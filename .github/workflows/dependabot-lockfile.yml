name: Update Gradle Lockfiles on Dependabot PRs

on:
  pull_request:
    paths:
      - '**/build.gradle.kts'
      - '**/build.gradle'
      - 'gradle/libs.versions.toml'
      - 'gradle.properties'

permissions:
  contents: write

jobs:
  update-lockfiles:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # Pushes made with GITHUB_TOKEN do not trigger workflows, so CI would never
          # re-run on the lockfile commit. LOCKFILE_TOKEN must be a *Dependabot*
          # secret: Dependabot-triggered runs cannot read Actions secrets.
          token: ${{ secrets.LOCKFILE_TOKEN || github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # `dependencies` is a per-project help task, so it must be invoked on every
      # project explicitly or only the root and settings lockfiles get rewritten.
      - name: Generate Gradle Lockfiles
        run: |
          mapfile -t projects < <(./gradlew -q projects | sed -nE "s/^project '([^']+)'.*/\1/p")
          ./gradlew dependencies "${projects[@]/%/:dependencies}" --write-locks

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "**/gradle.lockfile" "*.lockfile"
          if ! git diff --staged --quiet; then
            git commit -m "chore(deps): auto-update gradle lockfiles"
            git push
          fi
