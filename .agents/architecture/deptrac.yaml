deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*Tests.*#'
  layers:
    - name: Domain
      collectors:
        - type: classLike
          value: .*\\Domain\\.*
    - name: Infrastructure
      collectors:
        - type: classLike
          value: .*\\Infrastructure\\.*
  ruleset:
    Domain: []
    Infrastructure:
      - Domain
