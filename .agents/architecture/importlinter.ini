[importlinter]
root_package = your_python_package

# Replace package names before enabling this contract.
[importlinter:contract:domain-does-not-import-infrastructure]
name = Domain does not import infrastructure
type = forbidden
source_modules =
    your_python_package.domain
forbidden_modules =
    your_python_package.infrastructure
    your_python_package.adapters
    your_python_package.web
