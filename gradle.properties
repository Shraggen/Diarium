#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
kotlin.native.ignoreDisabledTargets=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.caching=true

#Toolchains: the daemon JDK (gradle/gradle-daemon-jvm.properties) and the
#compile/test JDK (jvmToolchain) are downloaded through the foojay resolver.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.builder.sdkDownload=true
